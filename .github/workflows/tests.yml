name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-test:
    name: bun test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: bun test
        shell: pwsh
        run: |
          bun test
          exit $LASTEXITCODE
